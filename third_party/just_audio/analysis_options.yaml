include: package:flutter_lints/flutter.yaml

analyzer:
  # Upstream fixtures and example apps resolve their own development packages.
  exclude:
    - test/**
    - example/**
    - integration_test/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    prefer_single_quotes: false
    unawaited_futures: false
    # Preserve upstream constructor style while the app uses newer Flutter lints.
    use_super_parameters: false
