name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Forward-compat with GitHub's Node-20 → Node-24 transition (default 2026-06-02).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze-and-test:
    name: Analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: third_party/scdrm/go.mod
          cache-dependency-path: third_party/scdrm/go.sum

      - name: Test scdrm (go)
        working-directory: third_party/scdrm
        run: go test ./...

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # Pin to match local dev (`flutter --version`) — newer stable broke
          # ReorderableListView onReorder deprecation. Bump when migrating.
          flutter-version: 3.41.0
          channel: stable
          cache: true

      - name: Cache pub
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  # libscdrm.dylib is committed to git; this job proves the committed
  # sources still build into a macOS dylib (cgo needs a mac runner).
  # the rebuilt binary is not compared to the committed one: go builds
  # are not bit-reproducible across toolchains here.
  scdrm-macos:
    name: Build scdrm (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: third_party/scdrm/go.mod
          cache-dependency-path: third_party/scdrm/go.sum

      - name: Build libscdrm.dylib
        run: tool/build_scdrm.sh arm64 x86_64

      - name: Show built dylib
        run: |
          lipo -archs macos/Runner/Frameworks/libscdrm.dylib
          otool -D macos/Runner/Frameworks/libscdrm.dylib
