name: Release

on:
  push:
    tags:
      - 'v*'
  # Dry run from any branch: builds, signs and notarizes, but the
  # publish job is gated on a tag ref, so no release is created.
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── macOS: build → sign with Developer ID Application → notarize → staple → DMG ──
  macos:
    name: Build macOS (signed + notarized)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check tag matches pubspec and kAppVersion
        if: startsWith(github.ref, 'refs/tags/')
        run: tool/check_version.sh "$GITHUB_REF_NAME"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.41.0
          channel: stable
          cache: true

      - name: Cache pub
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pub-cache
          key: pub-macos-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-macos-

      - name: Cache CocoaPods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            macos/Pods
            ~/Library/Caches/CocoaPods
          key: pods-macos-${{ hashFiles('macos/Podfile.lock', 'pubspec.lock') }}
          restore-keys: pods-macos-

      - name: Install dependencies
        run: flutter pub get

      - name: Import Developer ID signing certificate
        uses: apple-actions/import-codesign-certs@77ba2a2a8f5cfc8c405ebf3159f767c323e238f9 # v7.1.0
        with:
          p12-file-base64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERT_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Disable Xcode auto-signing in pbxproj (CI only)
        # flutter build macos doesn't have --no-codesign (iOS-only flag)
        # and env-var overrides don't propagate through the flutter
        # wrapper. The least invasive workaround: patch the runner's
        # checkout of pbxproj before build. Local dev is untouched.
        # Our Codesign step below does the real signing, inside out.
        run: |
          sed -i '' \
            -e 's|"CODE_SIGN_IDENTITY\[sdk=macosx\*\]" = "Apple Development";|"CODE_SIGN_IDENTITY[sdk=macosx*]" = "-";|g' \
            -e 's|CODE_SIGN_STYLE = Automatic;|CODE_SIGN_STYLE = Manual;|g' \
            -e 's|DEVELOPMENT_TEAM = DYNB5QPZ63;|DEVELOPMENT_TEAM = "";|g' \
            macos/Runner.xcodeproj/project.pbxproj
          echo "--- patched signing settings ---"
          grep -nE "CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM" macos/Runner.xcodeproj/project.pbxproj | head

      - name: Bundle the widevine device profile (macOS only)
        # the profile never lives in git: it comes from a secret and is
        # written into assets/widevine/ just for this build. without the
        # secret the build still works, go+ is just off.
        env:
          WIDEVINE_DEVICE_WVD_BASE64: ${{ secrets.WIDEVINE_DEVICE_WVD_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$WIDEVINE_DEVICE_WVD_BASE64" ]; then
            echo "::warning::WIDEVINE_DEVICE_WVD_BASE64 is not set: building without go+ support"
            exit 0
          fi
          umask 077
          printf '%s' "$WIDEVINE_DEVICE_WVD_BASE64" | base64 --decode > assets/widevine/device.wvd
          test -s assets/widevine/device.wvd
          echo "widevine profile written ($(wc -c < assets/widevine/device.wvd) bytes)"

      - name: Refuse to ship the sparkle key placeholder
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if grep -q REPLACE_WITH_SPARKLE macos/Runner/Info.plist; then
            echo "::error::SUPublicEDKey in macos/Runner/Info.plist is still the placeholder (see docs/releasing.md)"
            exit 1
          fi

      - name: Build macOS release
        env:
          REF_NAME: ${{ github.ref_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SHARED_SECRET: ${{ secrets.LASTFM_SHARED_SECRET }}
        run: |
          flutter build macos --release \
            --dart-define=APP_VERSION="$REF_NAME" \
            --dart-define=LASTFM_API_KEY="$LASTFM_API_KEY" \
            --dart-define=LASTFM_SHARED_SECRET="$LASTFM_SHARED_SECRET"

      - name: Remove the widevine profile from the workspace
        if: always()
        run: rm -f assets/widevine/device.wvd

      - name: Codesign .app (Developer ID Application)
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/Waveform.app"
          # apple-actions/import-codesign-certs imports into a dedicated
          # signing_temp.keychain that isn't always added to the user
          # search list, so `security find-identity` without an explicit
          # keychain returns empty. Pass the keychain explicitly to both
          # find-identity and codesign --keychain.
          KEYCHAIN="$HOME/Library/Keychains/signing_temp.keychain-db"
          security list-keychains
          security find-identity -v -p codesigning "$KEYCHAIN"
          # sign by sha-1 hash: a name with duplicates is ambiguous
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | \
            awk '/Developer ID Application/ {print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found in $KEYCHAIN"
            exit 1
          fi
          echo "Signing with identity: $IDENTITY"
          # later steps (dmg) sign with the same identity
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          sign() {
            codesign --force --options runtime --timestamp \
              --sign "$IDENTITY" --keychain "$KEYCHAIN" "$@"
          }

          # codesign does not expand build settings: resolve the sparkle
          # mach-lookup names ($(PRODUCT_BUNDLE_IDENTIFIER)-spks/-spki) here
          BUNDLE_ID=$(/usr/libexec/PlistBuddy \
            -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")
          ENTITLEMENTS="$RUNNER_TEMP/Release.entitlements"
          sed "s|\$(PRODUCT_BUNDLE_IDENTIFIER)|$BUNDLE_ID|g" \
            macos/Runner/Release.entitlements > "$ENTITLEMENTS"
          grep -q "$BUNDLE_ID-spks" "$ENTITLEMENTS"
          grep -q "$BUNDLE_ID-spki" "$ENTITLEMENTS"
          ! grep -q '\$(' "$ENTITLEMENTS"

          # inside out, no --deep: every nested bundle and every Mach-O
          # except the main executable, deepest path first (hardened
          # runtime + timestamp, no entitlements); the app goes last with
          # its entitlements. libscdrm.dylib ships ad-hoc signed from git
          # and is re-signed here.
          MAIN="$APP/Contents/MacOS/$(/usr/libexec/PlistBuddy \
            -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          {
            find "$APP/Contents" -type d \( -name '*.framework' \
              -o -name '*.app' -o -name '*.xpc' -o -name '*.appex' \) -print
            find "$APP/Contents" -type f ! -path "$MAIN" -print0 |
              while IFS= read -r -d '' f; do
                case "$(file -b "$f")" in *Mach-O*) echo "$f" ;; esac
              done
          } | awk '{ print gsub("/", "/") "\t" $0 }' | sort -rn | cut -f2- |
            while IFS= read -r target; do
              case "$target" in
                # the executable inside sparkle's downloader.xpc is signed
                # with the bundle below: signing it on its own first would
                # strip the entitlements the bundle signature preserves
                */Downloader.xpc/Contents/MacOS/*) continue ;;
                # downloader.xpc carries its own network entitlement:
                # keep what sparkle shipped
                */Downloader.xpc)
                  echo "signing (keeping entitlements): $target"
                  sign --preserve-metadata=entitlements "$target" || exit 1 ;;
                *)
                  echo "signing: $target"
                  sign "$target" || exit 1 ;;
              esac
            done
          sign --entitlements "$ENTITLEMENTS" "$APP"

          # sparkle's helpers must be signed and carry our team identity
          SPK="$APP/Contents/Frameworks/Sparkle.framework"
          for part in Versions/B/Autoupdate Versions/B/Updater.app \
            Versions/B/XPCServices/Installer.xpc \
            Versions/B/XPCServices/Downloader.xpc; do
            test -e "$SPK/$part" || { echo "::error::missing $part"; exit 1; }
            codesign --verify --strict --verbose=2 "$SPK/$part"
          done
          for xpc in Installer Downloader; do
            echo "--- $xpc.xpc entitlements ---"
            codesign -d --entitlements :- "$SPK/Versions/B/XPCServices/$xpc.xpc" 2>&1
          done

          codesign --verify --strict --deep --verbose=2 "$APP"
          # sparkle's Downloader.xpc ships without entitlements and is off
          # (SUEnableDownloaderService unset): the update is downloaded by the
          # app itself, so the app must carry the outgoing network entitlement
          APP_ENT=$(codesign -d --entitlements :- "$APP" 2>&1)
          echo "$APP_ENT"
          for key in com.apple.security.app-sandbox \
            com.apple.security.network.client; do
            grep -q "$key" <<<"$APP_ENT" ||
              { echo "::error::signed app lost $key"; exit 1; }
          done

      - name: Prepare notary API key
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          umask 077
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$KEY"
          test -s "$KEY"
          echo "NOTARY_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Notarize .app
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: tool/notarize.sh build/macos/Build/Products/Release/Waveform.app

      - name: Staple .app and assess with gatekeeper
        run: |
          APP="build/macos/Build/Products/Release/Waveform.app"
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute -vv "$APP"

      - name: Build, sign, notarize and staple DMG
        env:
          REF_NAME: ${{ github.ref_name }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          APP="build/macos/Build/Products/Release/Waveform.app"
          DMG="waveform-macos-$REF_NAME.dmg"
          # Styled DMG (background, window, icon layout) from the stapled
          # .app; make_dmg.sh copies it with ditto, keeping the ticket.
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet dmgbuild==1.6.5
          PATH="$RUNNER_TEMP/dmgbuild/bin:$PATH" \
            tool/make_dmg.sh "$APP" "$DMG" "Waveform $REF_NAME"
          MNT="$RUNNER_TEMP/dmg-check"
          mkdir -p "$MNT"
          hdiutil attach -readonly -nobrowse -mountpoint "$MNT" "$DMG"
          xcrun stapler validate "$MNT/Waveform.app" \
            || { hdiutil detach "$MNT"; exit 1; }
          # the appcast advertises pubspec's version: the dmg must carry it
          WANT_VER=$(sed -nE 's/^version:[[:space:]]*([0-9.]+)\+([0-9]+).*/\1/p' pubspec.yaml)
          WANT_BUILD=$(sed -nE 's/^version:[[:space:]]*([0-9.]+)\+([0-9]+).*/\2/p' pubspec.yaml)
          GOT_VER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$MNT/Waveform.app/Contents/Info.plist")
          GOT_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$MNT/Waveform.app/Contents/Info.plist")
          hdiutil detach "$MNT"
          if [ "$GOT_VER" != "$WANT_VER" ] || [ "$GOT_BUILD" != "$WANT_BUILD" ]; then
            echo "::error::dmg is $GOT_VER ($GOT_BUILD), pubspec is $WANT_VER ($WANT_BUILD)"
            exit 1
          fi
          codesign --force --timestamp \
            --sign "$SIGN_IDENTITY" --keychain "$SIGN_KEYCHAIN" "$DMG"
          codesign --verify --verbose=2 "$DMG"
          tool/notarize.sh "$DMG"
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature -v "$DMG"
          ls -lh "$DMG"

      - name: Remove notary API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-dmg
          path: waveform-macos-${{ github.ref_name }}.dmg

  # ── Windows: unsigned zip (EV cert is backlog) ──
  windows:
    name: Build Windows (unsigned)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check tag matches pubspec and kAppVersion
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: tool/check_version.sh "$GITHUB_REF_NAME"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.41.0
          channel: stable
          cache: true

      - name: Cache pub
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pub-cache
          key: pub-windows-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-windows-

      - name: Install dependencies
        run: flutter pub get

      - name: Refuse to build with a widevine device profile
        shell: bash
        run: tool/check_no_wvd.sh assets

      - name: Refuse to ship the sparkle key placeholder
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if grep -q REPLACE_WITH_SPARKLE windows/runner/Runner.rc; then
            echo "::error::EdDSAPub in windows/runner/Runner.rc is still the placeholder (see docs/releasing.md)"
            exit 1
          fi

      - name: Build Windows release
        # Default shell on windows-latest is PowerShell, which uses
        # backtick (not ^) for line continuation. Single-line keeps it
        # shell-agnostic. Values come from env, never from script text.
        env:
          REF_NAME: ${{ github.ref_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SHARED_SECRET: ${{ secrets.LASTFM_SHARED_SECRET }}
        run: flutter build windows --release "--dart-define=APP_VERSION=$env:REF_NAME" "--dart-define=LASTFM_API_KEY=$env:LASTFM_API_KEY" "--dart-define=LASTFM_SHARED_SECRET=$env:LASTFM_SHARED_SECRET"

      - name: Verify no widevine profile in build output
        shell: bash
        run: tool/check_no_wvd.sh build

      # winsparkle accepts unsigned updates when the exe carries no EdDSAPub
      # resource, so a build without the compiled-in key must not ship.
      - name: Verify the update public key is compiled into the exe
        shell: bash
        run: |
          KEY=$(sed -n 's/^EdDSAPub EDDSA {"\([^"]*\)"}.*/\1/p' windows/runner/Runner.rc)
          test -n "$KEY" || { echo "::error::no EdDSAPub in Runner.rc"; exit 1; }
          python3 - "$KEY" build/windows/x64/runner/Release/*.exe <<'PY'
          import sys
          key = sys.argv[1]
          exes = sys.argv[2:]
          needles = (key.encode('ascii'), key.encode('utf-16-le'))
          for exe in exes:
              data = open(exe, 'rb').read()
              if any(n in data for n in needles):
                  print('EdDSAPub found in', exe)
                  sys.exit(0)
          print('::error::EdDSAPub resource missing from the built exe')
          sys.exit(1)
          PY

      - name: Package Windows zip
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $zip = "waveform-windows-$env:REF_NAME.zip"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath $zip
          Get-Item $zip | Select-Object Name, Length
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          $bad = $z.Entries | Where-Object { $_.FullName -match '\.wvd(\.|$)' }
          $z.Dispose()
          if ($bad) { throw "widevine profile in zip: $($bad.FullName)" }

      - name: Build per-user installer (Inno Setup)
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --version=6.4.3 --no-progress -y
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\d+\.\d+\.\d+)\+\d+').Matches[0].Groups[1].Value
          $src = (Resolve-Path build/windows/x64/runner/Release).Path
          $name = "waveform-windows-$env:REF_NAME-setup"
          & $iscc "/DAppVersion=$version" "/DSourceDir=$src" "/DOutputName=$name" "/O$PWD" windows/installer/waveform.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
          Get-Item "$name.exe" | Select-Object Name, Length

      - name: Verify no widevine profile inside the installer
        # install it for real (per-user, silent) into a scratch dir and scan
        # what landed on disk; the compressed payload can't be grepped
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          SETUP="waveform-windows-$REF_NAME-setup.exe"
          SCRATCH="$RUNNER_TEMP/installer-check"
          "./$SETUP" //VERYSILENT //SUPPRESSMSGBOXES //NORESTART //SP- //NOICONS \
            "//DIR=$(cygpath -w "$SCRATCH")" //LOG="$(cygpath -w "$RUNNER_TEMP/setup.log")"
          test -f "$SCRATCH/waveform_app.exe"
          tool/check_no_wvd.sh "$SCRATCH"
          "$SCRATCH"/unins000.exe //VERYSILENT //SUPPRESSMSGBOXES || true

      - name: Upload Windows artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-zip
          path: waveform-windows-${{ github.ref_name }}.zip

      - name: Upload Windows installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-setup
          path: waveform-windows-${{ github.ref_name }}-setup.exe

  # ── Linux: unsigned tar.gz ──
  linux:
    name: Build Linux (unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check tag matches pubspec and kAppVersion
        if: startsWith(github.ref, 'refs/tags/')
        run: tool/check_version.sh "$GITHUB_REF_NAME"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.41.0
          channel: stable
          cache: true

      - name: Cache pub
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pub-cache
          key: pub-linux-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-linux-

      - name: Cache apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /var/cache/apt/archives
          key: apt-linux-flutter-deps-v3

      - name: Install linux build deps
        # webkit2gtk + libsoup are REQUIRED by the vendored
        # desktop_webview_window CMake. Without these, configure fails
        # within seconds.
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libmpv-dev mpv zsync

      - name: Install pub dependencies
        run: flutter pub get

      - name: Refuse to build with a widevine device profile
        run: tool/check_no_wvd.sh assets

      - name: Build Linux release
        env:
          REF_NAME: ${{ github.ref_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SHARED_SECRET: ${{ secrets.LASTFM_SHARED_SECRET }}
        run: |
          flutter build linux --release \
            --dart-define=APP_VERSION="$REF_NAME" \
            --dart-define=LASTFM_API_KEY="$LASTFM_API_KEY" \
            --dart-define=LASTFM_SHARED_SECRET="$LASTFM_SHARED_SECRET"

      - name: Verify no widevine profile in build output
        run: tool/check_no_wvd.sh build

      - name: Package Linux tar.gz
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAR="waveform-linux-$REF_NAME.tar.gz"
          tar czf "$TAR" -C build/linux/x64/release/bundle .
          if tar tzf "$TAR" | grep -E '\.wvd(\.|$)'; then
            echo "::error::widevine profile in tar.gz"
            exit 1
          fi
          ls -lh "$TAR"

      - name: Package AppImage (+ zsync)
        env:
          REF_NAME: ${{ github.ref_name }}
        run: tool/make_appimage.sh build/linux/x64/release/bundle "$REF_NAME"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-tar
          path: waveform-linux-${{ github.ref_name }}.tar.gz

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-appimage
          path: |
            waveform-${{ github.ref_name }}-x86_64.AppImage
            waveform-${{ github.ref_name }}-x86_64.AppImage.zsync

  # ── Appcasts: sign the final installers with the sparkle ed25519 key ──
  # Runs after the macOS DMG is notarized and stapled (the signed bytes must
  # be the shipped bytes). A dry run signs with a throwaway key so the whole
  # path is exercised without the real secret.
  appcast:
    name: Build appcasts
    needs: [macos, windows]
    if: always() && needs.macos.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist

      - name: Install signer dependency
        run: pip install --quiet cryptography==44.0.0

      - name: Pick the signing key
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -n "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "using SPARKLE_ED_PRIVATE_KEY"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY is not set: refusing to publish unsigned updates"
            exit 1
          else
            echo "::warning::SPARKLE_ED_PRIVATE_KEY is not set: dry run signs with a throwaway key"
            python3 - <<'PY' >> "$RUNNER_TEMP/dry.key"
          import base64
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives import serialization as s
          k = Ed25519PrivateKey.generate().private_bytes(
              s.Encoding.Raw, s.PrivateFormat.Raw, s.NoEncryption())
          print(base64.b64encode(k).decode())
          PY
            echo "DRY_KEY_FILE=$RUNNER_TEMP/dry.key" >> "$GITHUB_ENV"
          fi

      - name: Generate appcast-macos.xml
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          [ -z "${DRY_KEY_FILE:-}" ] || export SPARKLE_ED_PRIVATE_KEY="$(cat "$DRY_KEY_FILE")"
          # tags sign against the real tag (so -rc urls are right) and must
          # match the committed public keys; a dry run has a branch name, so
          # it uses the pubspec version just to exercise the format
          if [ "$IS_TAG" = true ]; then
            TAG="$REF_NAME"; CHECK=--check-public-keys
          else
            TAG="v$(sed -nE 's/^version:[[:space:]]*([0-9.]+)\+.*/\1/p' pubspec.yaml)"; CHECK=
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "CHECK=$CHECK" >> "$GITHUB_ENV"
          DMG=$(ls dist/macos-dmg/*.dmg)
          mkdir -p appcasts
          python3 tool/appcast.py --platform macos --file "$DMG" \
            --tag "$TAG" --out appcasts/appcast-macos.xml $CHECK
          cat appcasts/appcast-macos.xml

      - name: Generate appcast-windows.xml
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          [ -z "${DRY_KEY_FILE:-}" ] || export SPARKLE_ED_PRIVATE_KEY="$(cat "$DRY_KEY_FILE")"
          SETUP=$(ls dist/windows-setup/*-setup.exe 2>/dev/null || true)
          if [ -z "$SETUP" ]; then
            echo "::warning::no windows installer: skipping appcast-windows.xml"
            exit 0
          fi
          python3 tool/appcast.py --platform windows --file "$SETUP" \
            --tag "$TAG" --out appcasts/appcast-windows.xml $CHECK
          cat appcasts/appcast-windows.xml

      - name: Upload appcasts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: appcasts
          path: appcasts/*.xml

  # ── Publish: gather artifacts → GitHub Release ──
  # Only macOS is required; Windows/Linux are best-effort and don't
  # block the release if they fail. The Flatten step uses globs that
  # tolerate missing files, so a missing zip/tar.gz is fine. Waits for
  # all three so their artifacts are uploaded before download. Never
  # publishes from a workflow_dispatch dry run.
  release:
    name: Publish GitHub Release
    needs: [macos, windows, linux, appcast]
    if: >-
      always() && needs.macos.result == 'success'
      && needs.appcast.result == 'success'
      && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find dist -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.tar.gz' \
          -o -name '*.exe' -o -name '*.xml' \
          -o -name '*.AppImage' -o -name '*.zsync' \) \
            -exec cp -v {} release/ \; || true
          ls -lh release/

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Waveform ${{ github.ref_name }}
          body_path: .github/release_template.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: false
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.zsync
            release/*.tar.gz
            release/appcast-*.xml
