name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── macOS: build → sign with Developer ID Application → notarize → staple → DMG ──
  macos:
    name: Build macOS (signed + notarized)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.0
          channel: stable
          cache: true

      - name: Cache pub
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-macos-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-macos-

      - name: Cache CocoaPods
        uses: actions/cache@v5
        with:
          path: |
            macos/Pods
            ~/Library/Caches/CocoaPods
          key: pods-macos-${{ hashFiles('macos/Podfile.lock', 'pubspec.lock') }}
          restore-keys: pods-macos-

      - name: Install dependencies
        run: flutter pub get

      - name: Import Developer ID signing certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERT_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Disable Xcode auto-signing in pbxproj (CI only)
        # flutter build macos doesn't have --no-codesign (iOS-only flag)
        # and env-var overrides don't propagate through the flutter
        # wrapper. The least invasive workaround: patch the runner's
        # checkout of pbxproj before build. Local dev is untouched.
        # Our Codesign step below does the real signing with --deep.
        run: |
          sed -i '' \
            -e 's|"CODE_SIGN_IDENTITY\[sdk=macosx\*\]" = "Apple Development";|"CODE_SIGN_IDENTITY[sdk=macosx*]" = "-";|g' \
            -e 's|CODE_SIGN_STYLE = Automatic;|CODE_SIGN_STYLE = Manual;|g' \
            -e 's|DEVELOPMENT_TEAM = DYNB5QPZ63;|DEVELOPMENT_TEAM = "";|g' \
            macos/Runner.xcodeproj/project.pbxproj
          echo "--- patched signing settings ---"
          grep -nE "CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM" macos/Runner.xcodeproj/project.pbxproj | head

      - name: Build macOS release
        run: |
          flutter build macos --release \
            --dart-define=APP_VERSION=${{ github.ref_name }} \
            --dart-define=LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }} \
            --dart-define=LASTFM_SHARED_SECRET=${{ secrets.LASTFM_SHARED_SECRET }}

      - name: Codesign .app (Developer ID Application)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP="build/macos/Build/Products/Release/Waveform.app"
          # apple-actions/import-codesign-certs imports into a dedicated
          # signing_temp.keychain that isn't always added to the user
          # search list, so `security find-identity` without an explicit
          # keychain returns empty. Pass the keychain explicitly to both
          # find-identity and codesign --keychain.
          KEYCHAIN="$HOME/Library/Keychains/signing_temp.keychain-db"
          security list-keychains
          security find-identity -v -p codesigning "$KEYCHAIN"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | \
            grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found in $KEYCHAIN"
            exit 1
          fi
          echo "Signing with: $IDENTITY"
          codesign --deep --force --options runtime --timestamp \
            --sign "$IDENTITY" \
            --keychain "$KEYCHAIN" \
            --entitlements macos/Runner/Release.entitlements \
            "$APP"
          codesign --verify --strict --deep --verbose=2 "$APP"

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          APP="build/macos/Build/Products/Release/Waveform.app"
          ZIP="$RUNNER_TEMP/waveform_app.zip"
          # zip preserving symlinks/metadata for notarization
          /usr/bin/ditto -c -k --keepParent "$APP" "$ZIP"
          xcrun notarytool submit "$ZIP" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait

      - name: Staple notarization ticket
        run: |
          APP="build/macos/Build/Products/Release/Waveform.app"
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

      - name: Build DMG
        run: |
          APP="build/macos/Build/Products/Release/Waveform.app"
          DMG="waveform-macos-${{ github.ref_name }}.dmg"
          # Stage the .app + Applications symlink in a temp folder, then make DMG.
          STAGE="$RUNNER_TEMP/dmg-stage"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -format UDZO -fs HFS+ \
            -volname "Waveform ${{ github.ref_name }}" \
            -srcfolder "$STAGE" "$DMG"
          ls -lh "$DMG"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: waveform-macos-${{ github.ref_name }}.dmg

  # ── Windows: unsigned zip (EV cert is backlog) ──
  windows:
    name: Build Windows (unsigned)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.0
          channel: stable
          cache: true

      - name: Cache pub
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-windows-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-windows-

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        # Default shell on windows-latest is PowerShell, which uses
        # backtick (not ^) for line continuation. Single-line keeps it
        # shell-agnostic.
        run: flutter build windows --release --dart-define=APP_VERSION=${{ github.ref_name }} --dart-define=LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }} --dart-define=LASTFM_SHARED_SECRET=${{ secrets.LASTFM_SHARED_SECRET }}

      - name: Package Windows zip
        shell: pwsh
        run: |
          $zip = "waveform-windows-${{ github.ref_name }}.zip"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath $zip
          Get-Item $zip | Select-Object Name, Length

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-zip
          path: waveform-windows-${{ github.ref_name }}.zip

  # ── Linux: unsigned tar.gz ──
  linux:
    name: Build Linux (unsigned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.0
          channel: stable
          cache: true

      - name: Cache pub
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-linux-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-linux-

      - name: Cache apt packages
        uses: actions/cache@v5
        with:
          path: /var/cache/apt/archives
          key: apt-linux-flutter-deps

      - name: Install linux build deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            ninja-build libgtk-3-dev libsecret-1-dev libjsoncpp-dev

      - name: Install pub dependencies
        run: flutter pub get

      - name: Build Linux release
        run: |
          flutter build linux --release \
            --dart-define=APP_VERSION=${{ github.ref_name }} \
            --dart-define=LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }} \
            --dart-define=LASTFM_SHARED_SECRET=${{ secrets.LASTFM_SHARED_SECRET }}

      - name: Package Linux tar.gz
        run: |
          TAR="waveform-linux-${{ github.ref_name }}.tar.gz"
          tar czf "$TAR" -C build/linux/x64/release/bundle .
          ls -lh "$TAR"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-tar
          path: waveform-linux-${{ github.ref_name }}.tar.gz

  # ── Publish: gather artifacts → GitHub Release ──
  # Only macOS is required; Windows/Linux are best-effort and don't
  # block the release if they fail. The Flatten step uses globs that
  # tolerate missing files, so a missing zip/tar.gz is fine.
  release:
    name: Publish GitHub Release
    needs: [macos]
    if: always() && needs.macos.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find dist -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.tar.gz' \) \
            -exec cp -v {} release/ \; || true
          ls -lh release/

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Waveform ${{ github.ref_name }}
          body_path: .github/release_template.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: false
          files: |
            release/*.dmg
            release/*.zip
            release/*.tar.gz
