name: macOS build check

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'macos/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  macos-debug-build:
    name: Build macOS (debug, unsigned)
    # github-hosted by default; repo variable MACOS_RUNNER=self-hosted moves
    # it to our own mac. pull requests from forks always stay on github-hosted.
    runs-on: ${{ (vars.MACOS_RUNNER == 'self-hosted' && !github.event.pull_request.head.repo.fork) && fromJSON('["self-hosted", "macOS", "ARM64", "waveform"]') || 'macos-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.41.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Debug build — no signing required. Catches plugin / entitlement breakage.
      # The Runner Debug config signs automatically with the dev team, and the
      # runner has no certificate → turn signing off for xcodebuild.
      # flutter passes FLUTTER_XCODE_* env vars through as Xcode build settings.
      - name: Build macOS debug
        run: flutter build macos --debug --no-tree-shake-icons
        env:
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: 'NO'
          FLUTTER_XCODE_CODE_SIGNING_REQUIRED: 'NO'
          FLUTTER_XCODE_DEVELOPMENT_TEAM: ''
